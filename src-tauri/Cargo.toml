[package]
name = "audionook"
version = "0.1.0"
description = "Audionook: turn text and documents into audiobooks, narrated on your own machine"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "From a URL…" fetches the page natively, so it isn't subject to the web
# view's cross-origin rules. rustls keeps the build free of system TLS setup.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
